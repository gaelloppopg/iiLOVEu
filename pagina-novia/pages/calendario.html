<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario de Fechas Importantes</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/calendario.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>" />
</head>
<body class="calendario-body">

  <!-- HEADER -->
  <header class="cal-header">
    <div class="cal-header-left">
      <a href="../index.html" class="cal-back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver
      </a>
      <h1>Calendario</h1>
    </div>
    <button class="cal-add-btn" id="btnAgregarFecha">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Nueva fecha</span>
    </button>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="cal-main">

    <!-- CALENDARIO -->
    <section class="cal-calendar-section">
      <div class="cal-calendar">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="btnMesAnterior" aria-label="Mes anterior">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <h2 id="mesActual">Enero 2026</h2>
          <button class="cal-nav-btn" id="btnMesSiguiente" aria-label="Mes siguiente">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <div class="cal-weekdays">
          <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
        </div>

        <div class="cal-days" id="calDays"></div>
      </div>
    </section>

    <!-- PANEL LATERAL: PRÓXIMAS FECHAS -->
    <aside class="cal-sidebar">
      <div class="cal-sidebar-header">
        <h3>Próximas fechas</h3>
        <span class="cal-counter" id="proximasCount">0</span>
      </div>
      <div class="cal-lista" id="listaFechas">
        <div class="cal-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <p>Aún no hay fechas guardadas</p>
        </div>
      </div>
    </aside>
  </main>

  <!-- MODAL NUEVA FECHA -->
  <div class="cal-modal" id="modalFecha">
    <div class="cal-modal-box">
      <button class="cal-modal-close" id="btnCerrarModalFecha" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <h2 id="modalTitulo">Nueva fecha importante</h2>
      <p class="cal-modal-sub">Guarda un día especial en nuestro calendario</p>

      <form id="formFecha" class="cal-form">
        <div class="cal-form-group">
          <label for="inputTitulo">Título</label>
          <input type="text" id="inputTitulo" placeholder="Ej: Nuestro aniversario" required maxlength="80" />
        </div>

        <div class="cal-form-group">
          <label for="inputFecha">Fecha</label>
          <input type="date" id="inputFecha" required />
        </div>

        <div class="cal-form-group">
          <label for="inputTipo">Tipo de fecha</label>
          <div class="cal-tipo-selector" id="tipoSelector">
            <button type="button" class="cal-tipo-btn activo" data-tipo="aniversario">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
              <span>Aniversario</span>
            </button>
            <button type="button" class="cal-tipo-btn" data-tipo="cumpleanos">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"></path>
                <path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"></path>
                <path d="M2 21h20"></path>
                <path d="M7 8v3"></path>
                <path d="M12 8v3"></path>
                <path d="M17 8v3"></path>
                <path d="M7 4h.01"></path>
                <path d="M12 4h.01"></path>
                <path d="M17 4h.01"></path>
              </svg>
              <span>Cumpleaños</span>
            </button>
            <button type="button" class="cal-tipo-btn" data-tipo="cita">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>Cita</span>
            </button>
            <button type="button" class="cal-tipo-btn" data-tipo="especial">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
              <span>Especial</span>
            </button>
          </div>
        </div>

        <div class="cal-form-group">
          <label for="inputNotas">Notas (opcional)</label>
          <textarea id="inputNotas" placeholder="Detalles, recuerdos..." rows="3" maxlength="300"></textarea>
        </div>

        <div class="cal-form-group">
          <label class="cal-checkbox-label">
            <input type="checkbox" id="inputRecurrente" />
            <span>Repetir cada año</span>
          </label>
        </div>

        <div class="cal-form-actions">
          <button type="button" class="cal-btn-cancel" id="btnCancelarFecha">Cancelar</button>
          <button type="submit" class="cal-btn-save" id="btnGuardarFecha">Guardar fecha</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DETALLE FECHA -->
  <div class="cal-modal" id="modalDetalle">
    <div class="cal-modal-box cal-modal-detalle">
      <button class="cal-modal-close" id="btnCerrarDetalle" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div id="detalleContenido"></div>
      <div class="cal-detalle-acciones">
        <button class="cal-btn-delete" id="btnEliminarFecha">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Eliminar
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="cal-toast" id="toast"></div>

  <script type="module">
    import { protegerRuta } from '../js/proteger.js';
    import { supabase } from '../js/supabase.js';
    import { iniciarRealtimeGlobal } from '../js/realtime.js';

    let coupleId = null;
    let fechasGuardadas = [];
    let fechaActual = new Date();
    let tipoSeleccionado = 'aniversario';
    let fechaIdEliminar = null;

    // Colores elegantes para cada tipo de fecha
    const TIPOS_CAL = {
      aniversario: { color: '#7b2d41', label: 'Aniversario' }, /* Burdeos */
      cumpleanos: { color: '#2d4a3e', label: 'Cumpleaños' },   /* Verde Bosque */
      cita: { color: '#a3612b', label: 'Cita' },               /* Ámbar Oscuro */
      especial: { color: '#3b3a52', label: 'Especial' }        /* Azul Noche */
    };

    const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    // ==========================================
    // INICIALIZACIÓN
    // ==========================================
    async function init() {
      document.documentElement.style.visibility = "hidden";
      try {
        const datos = await protegerRuta();
        if (!datos || !datos.couple) return;
        coupleId = datos.couple.id;

        await cargarFechas();
        renderizarCalendario();
        iniciarRealtimeGlobal(coupleId);

        window.addEventListener('supabase-cambio', (e) => {
          if (e.detail.tabla === 'fechas_importantes') {
            cargarFechas().then(() => {
              renderizarCalendario();
              renderizarLista();
            });
          }
        });
      } catch (err) {
        console.error(err);
      } finally {
        document.documentElement.style.visibility = "visible";
      }
    }

    // ==========================================
    // CARGAR FECHAS DESDE SUPABASE
    // ==========================================
    async function cargarFechas() {
      const { data, error } = await supabase
        .from('fechas_importantes')
        .select('*')
        .eq('couple_id', coupleId)
        .order('fecha', { ascending: true });

      if (error) {
        console.error('Error cargando fechas:', error);
        return;
      }
      fechasGuardadas = data || [];
      renderizarLista();
    }

    // ==========================================
    // RENDERIZAR CALENDARIO
    // ==========================================
    function renderizarCalendario() {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();

      document.getElementById('mesActual').textContent = `${MESES[month]} ${year}`;

      const primerDia = new Date(year, month, 1);
      const ultimoDia = new Date(year, month + 1, 0);
      const diasEnMes = ultimoDia.getDate();

      // Ajustar: Lunes = 0
      let diaSemanaInicio = primerDia.getDay();
      diaSemanaInicio = diaSemanaInicio === 0 ? 6 : diaSemanaInicio - 1;

      const container = document.getElementById('calDays');
      container.innerHTML = '';

      // Días vacíos al inicio
      for (let i = 0; i < diaSemanaInicio; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day cal-day-empty';
        container.appendChild(empty);
      }

      // Días del mes
      for (let d = 1; d <= diasEnMes; d++) {
        const diaDiv = document.createElement('div');
        diaDiv.className = 'cal-day';

        const fechaStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const hoy = new Date();
        const esHoy = hoy.getFullYear() === year && hoy.getMonth() === month && hoy.getDate() === d;

        if (esHoy) diaDiv.classList.add('cal-day-hoy');

        const eventosDelDia = fechasGuardadas.filter(f => {
          const fDate = f.fecha;
          if (f.recurrente) {
            const fObj = new Date(fDate + 'T00:00:00');
            return fObj.getDate() === d && fObj.getMonth() === month;
          }
          return fDate === fechaStr;
        });

        if (eventosDelDia.length > 0) {
          diaDiv.classList.add('cal-day-con-evento');
          
          // Aplicamos el color del tipo de fecha al contorno de forma elegante
          const primerEvento = eventosDelDia[0];
          const configColor = TIPOS_CAL[primerEvento.tipo] || TIPOS_CAL.especial;
          
          diaDiv.style.borderColor = configColor.color;

          diaDiv.addEventListener('click', () => abrirDetalle(eventosDelDia));
        }

        diaDiv.innerHTML = `
          <span class="cal-day-num">${d}</span>
          ${eventosDelDia.length > 0 ? `
            <div class="cal-day-dots">
              <span class="cal-day-tag">${eventosDelDia[0].titulo}</span>
              ${eventosDelDia.length > 1 ? `<span class="cal-day-more">+${eventosDelDia.length - 1}</span>` : ''}
            </div>
          ` : ''}
        `;

        container.appendChild(diaDiv);
      }
    }

    // ==========================================
    // RENDERIZAR LISTA LATERAL
    // ==========================================
    function renderizarLista() {
      const lista = document.getElementById('listaFechas');
      const counter = document.getElementById('proximasCount');

      if (fechasGuardadas.length === 0) {
        lista.innerHTML = `
          <div class="cal-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <p>Aún no hay fechas guardadas</p>
          </div>
        `;
        counter.textContent = '0';
        return;
      }

      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);

      const conDias = fechasGuardadas.map(f => {
        let fechaObj = new Date(f.fecha + 'T00:00:00');
        if (f.recurrente) {
          const next = new Date(hoy.getFullYear(), fechaObj.getMonth(), fechaObj.getDate());
          if (next < hoy) next.setFullYear(hoy.getFullYear() + 1);
          fechaObj = next;
        }
        const diff = Math.ceil((fechaObj - hoy) / (1000 * 60 * 60 * 24));
        return { ...f, _fechaObj: fechaObj, _diasFaltantes: diff };
      }).sort((a, b) => a._diasFaltantes - b._diasFaltantes);

      counter.textContent = conDias.length;
      lista.innerHTML = conDias.map(f => {
        const cfg = TIPOS_CAL[f.tipo] || TIPOS_CAL.especial;
        const diasTexto = f._diasFaltantes === 0
          ? 'Hoy'
          : f._diasFaltantes === 1
            ? 'Mañana'
            : f._diasFaltantes > 0
              ? `En ${f._diasFaltantes} días`
              : 'Pasado';

        return `
          <div class="cal-item" data-id="${f.id}">
            <div class="cal-item-bar" style="background: ${cfg.color};"></div>
            <div class="cal-item-content">
              <h4>${escapeHtml(f.titulo)}</h4>
              <p>${f._fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}</p>
            </div>
            <span class="cal-item-dias ${f._diasFaltantes === 0 ? 'hoy' : ''}">${diasTexto}</span>
          </div>
        `;
      }).join('');

      lista.querySelectorAll('.cal-item').forEach(item => {
        item.addEventListener('click', () => {
          const id = item.dataset.id;
          const fecha = fechasGuardadas.find(f => String(f.id) === String(id));
          if (fecha) abrirDetalle([fecha]);
        });
      });
    }

    // ==========================================
    // DETALLE DE UNA FECHA
    // ==========================================
    function abrirDetalle(fechas) {
      const contenedor = document.getElementById('detalleContenido');
      fechaIdEliminar = fechas.length === 1 ? fechas[0].id : null;

      contenedor.innerHTML = fechas.map(f => {
        const cfg = TIPOS_CAL[f.tipo] || TIPOS_CAL.especial;
        const fechaObj = new Date(f.fecha + 'T00:00:00');
        return `
          <div class="cal-detalle-item">
            <span class="cal-detalle-tipo" style="color: ${cfg.color};">${cfg.label}</span>
            <h3>${escapeHtml(f.titulo)}</h3>
            <p class="cal-detalle-fecha">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              ${fechaObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
              ${f.recurrente ? ' · Se repite cada año' : ''}
            </p>
            ${f.notas ? `<p class="cal-detalle-notas">${escapeHtml(f.notas)}</p>` : ''}
          </div>
        `;
      }).join('');

      document.getElementById('btnEliminarFecha').style.display = fechaIdEliminar ? 'flex' : 'none';
      document.getElementById('modalDetalle').classList.add('activo');
    }

    // ==========================================
    // GUARDAR FECHA
    // ==========================================
    async function guardarFecha(e) {
      e.preventDefault();
      const titulo = document.getElementById('inputTitulo').value.trim();
      const fecha = document.getElementById('inputFecha').value;
      const notas = document.getElementById('inputNotas').value.trim();
      const recurrente = document.getElementById('inputRecurrente').checked;

      if (!titulo || !fecha) {
        mostrarToast('Completa los campos obligatorios', 'error');
        return;
      }

      const btn = document.getElementById('btnGuardarFecha');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        const { error } = await supabase.from('fechas_importantes').insert([{
          couple_id: coupleId,
          titulo,
          fecha,
          tipo: tipoSeleccionado,
          notas: notas || null,
          recurrente
        }]);

        if (error) throw error;

        mostrarToast('Fecha guardada', 'success');
        cerrarModalFecha();
        await cargarFechas();
        renderizarCalendario();
      } catch (err) {
        console.error(err);
        mostrarToast('Error al guardar: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar fecha';
      }
    }

    // ==========================================
    // ELIMINAR FECHA
    // ==========================================
    async function eliminarFecha() {
      if (!fechaIdEliminar) return;
      if (!confirm('¿Eliminar esta fecha?')) return;

      try {
        const { error } = await supabase.from('fechas_importantes').delete().eq('id', fechaIdEliminar);
        if (error) throw error;
        mostrarToast('Fecha eliminada', 'success');
        document.getElementById('modalDetalle').classList.remove('activo');
        await cargarFechas();
        renderizarCalendario();
      } catch (err) {
        mostrarToast('Error: ' + err.message, 'error');
      }
    }

    // ==========================================
    // UI HELPERS
    // ==========================================
    function abrirModalFecha() {
      document.getElementById('formFecha').reset();
      document.getElementById('inputFecha').value = new Date().toISOString().split('T')[0];
      tipoSeleccionado = 'aniversario';
      document.querySelectorAll('.cal-tipo-btn').forEach(b => b.classList.toggle('activo', b.dataset.tipo === 'aniversario'));
      document.getElementById('modalFecha').classList.add('activo');
    }

    function cerrarModalFecha() {
      document.getElementById('modalFecha').classList.remove('activo');
    }

    function mostrarToast(mensaje, tipo = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = mensaje;
      toast.className = 'cal-toast activo ' + tipo;
      setTimeout(() => toast.classList.remove('activo'), 3000);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ==========================================
    // EVENTOS
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      init();

      document.getElementById('btnMesAnterior').onclick = () => {
        fechaActual.setMonth(fechaActual.getMonth() - 1);
        renderizarCalendario();
      };
      document.getElementById('btnMesSiguiente').onclick = () => {
        fechaActual.setMonth(fechaActual.getMonth() + 1);
        renderizarCalendario();
      };

      document.getElementById('btnAgregarFecha').onclick = abrirModalFecha;
      document.getElementById('btnCerrarModalFecha').onclick = cerrarModalFecha;
      document.getElementById('btnCancelarFecha').onclick = cerrarModalFecha;
      document.getElementById('formFecha').onsubmit = guardarFecha;

      document.getElementById('tipoSelector').addEventListener('click', (e) => {
        const btn = e.target.closest('.cal-tipo-btn');
        if (!btn) return;
        document.querySelectorAll('.cal-tipo-btn').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');
        tipoSeleccionado = btn.dataset.tipo;
      });

      document.getElementById('btnCerrarDetalle').onclick = () => document.getElementById('modalDetalle').classList.remove('activo');
      document.getElementById('modalDetalle').onclick = (e) => {
        if (e.target.id === 'modalDetalle') document.getElementById('modalDetalle').classList.remove('activo');
      };
      document.getElementById('modalFecha').onclick = (e) => {
        if (e.target.id === 'modalFecha') cerrarModalFecha();
      };

      document.getElementById('btnEliminarFecha').onclick = eliminarFecha;
    });
  </script>
</body>
</html>
