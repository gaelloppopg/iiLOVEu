<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva Contraseña</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <!-- 🛑 IMPORTANTE: Detectar la sesión del enlace mágico -->
  <script type="module">
    import { supabase } from './js/supabase.js';
    // Supabase detecta automáticamente el token en la URL y crea una sesión temporal
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        console.log("Sesión de recuperación activa. Listo para cambiar contraseña.");
      }
    });
  </script>
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-lock">🔒</div>
      <h1>Nueva Contraseña</h1>
      <p class="login-sub">Escribe tu nueva contraseña de acceso.</p>

      <form id="formActualizar">
        <input type="password" id="passwordNueva" placeholder="Nueva contraseña (mín. 6 caracteres)" required minlength="6" style="width:100%; padding:16px; margin-bottom:10px; border-radius:14px; border:2px solid var(--rosa-suave); box-sizing: border-box;" />
        <input type="password" id="passwordConfirmar" placeholder="Confirmar contraseña" required minlength="6" style="width:100%; padding:16px; margin-bottom:15px; border-radius:14px; border:2px solid var(--rosa-suave); box-sizing: border-box;" />
        
        <button type="submit" class="btn btn-primary" id="btnActualizar" style="width:100%;">Actualizar Contraseña ✅</button>
      </form>

      <p class="login-error" id="errorMsg" style="color:red; margin-top:10px; font-weight: bold; font-size: 0.85rem;"></p>
      <p class="login-ok" id="okMsg" style="color:#2e7d32; margin-top:10px; font-weight: bold; font-size: 0.85rem;"></p>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';

    const form = document.getElementById('formActualizar');
    const btn = document.getElementById('btnActualizar');
    const errorMsg = document.getElementById('errorMsg');
    const okMsg = document.getElementById('okMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const pass1 = document.getElementById('passwordNueva').value;
      const pass2 = document.getElementById('passwordConfirmar').value;

      if (pass1 !== pass2) {
        errorMsg.textContent = "Las contraseñas no coinciden.";
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Actualizando...';
      errorMsg.textContent = '';
      okMsg.textContent = '';

      try {
        // 🛑 ACTUALIZAR LA CONTRASEÑA DEL USUARIO ACTUAL (la sesión se crea desde el enlace del correo)
        const { error } = await supabase.auth.updateUser({ password: pass1 });

        if (error) throw error;

        okMsg.textContent = "✅ Contraseña actualizada con éxito. Redirigiendo al inicio de sesión...";
        
        // Cerrar sesión y redirigir al login después de 2 segundos
        setTimeout(async () => {
          await supabase.auth.signOut();
          window.location.href = 'login.html';
        }, 2000);

      } catch (err) {
        console.error(err);
        errorMsg.textContent = "Error: " + err.message;
        btn.disabled = false;
        btn.textContent = 'Actualizar Contraseña ✅';
      }
    });
  </script>
</body>
</html>
